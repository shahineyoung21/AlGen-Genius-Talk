<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Genie — شات ذكي</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --accent: #FFE600;
      --accent-2: #7c5cff;
      --text: #f4f4f5;
      --muted: #9aa0ab;
      --user-bubble: #2a2f3a;
      --bot-bubble: #202a3f;
      --danger: #ff5c5c;
      --ok: #35d07f;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
    }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; background: var(--panel);
      border-bottom: 1px solid #262b36;
    }
    .logo {
      width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      display: grid; place-items: center; font-weight: 800; color: #161616; font-size: 18px;
    }
    header .title { font-weight: 700; font-size: 18px; line-height: 1.1; }
    header .sub { font-size: 12px; color: var(--muted); }
    header .spacer { flex: 1; }
    .icon-btn {
      background: var(--panel-2); border: 1px solid #2d3340; color: var(--text);
      width: 40px; height: 40px; border-radius: 10px; font-size: 18px; cursor: pointer;
    }
    .icon-btn:active { transform: scale(0.95); }

    #status {
      font-size: 12px; padding: 6px 16px; text-align: center;
      background: #221a1a; color: var(--danger); display: none;
    }
    #status.ok { background: #16271f; color: var(--ok); display: block; }
    #status.warn { background: #2a2410; color: var(--accent); display: block; }

    #messages {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; font-size: 15px; }
    .msg.user { align-self: flex-start; background: var(--user-bubble); border-bottom-right-radius: 4px; }
    .msg.bot  { align-self: flex-end;  background: var(--bot-bubble);  border-bottom-left-radius: 4px; }
    .msg.bot.typing { color: var(--muted); font-style: italic; }
    .welcome { text-align: center; color: var(--muted); font-size: 14px; margin: auto 0; padding: 20px; }
    .welcome b { color: var(--text); }

    footer {
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--panel);
      border-top: 1px solid #262b36; display: flex; gap: 8px; align-items: flex-end;
    }
    #input {
      flex: 1; resize: none; max-height: 120px; min-height: 44px;
      padding: 11px 14px; border-radius: 14px; border: 1px solid #2d3340;
      background: var(--panel-2); color: var(--text); font-size: 15px; font-family: inherit; line-height: 1.4;
    }
    #input:focus { outline: none; border-color: var(--accent-2); }
    #send {
      width: 44px; height: 44px; flex: 0 0 auto; border: none; border-radius: 14px; cursor: pointer;
      background: var(--accent); color: #161616; font-size: 20px; font-weight: 700;
    }
    #send:disabled { opacity: 0.5; }
    #send:active { transform: scale(0.95); }

    /* Settings modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
      align-items: center; justify-content: center; padding: 20px; z-index: 10;
    }
    .overlay.show { display: flex; }
    .modal { background: var(--panel); border: 1px solid #2d3340; border-radius: 18px; padding: 20px; width: 100%; max-width: 420px; }
    .modal h2 { margin: 0 0 4px; font-size: 18px; }
    .modal p { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.6; }
    .modal label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
    .modal input, .modal select {
      width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #2d3340;
      background: var(--panel-2); color: var(--text); font-size: 14px; font-family: inherit; margin-bottom: 14px;
    }
    .modal input:focus, .modal select:focus { outline: none; border-color: var(--accent-2); }
    .modal a { color: var(--accent); }
    .row { display: flex; gap: 8px; }
    .btn {
      flex: 1; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-size: 15px; font-weight: 700; font-family: inherit;
    }
    .btn.primary { background: var(--accent); color: #161616; }
    .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid #2d3340; }
  </style>
</head>
<body>
  <header>
    <div class="logo">G</div>
    <div>
      <div class="title">Genie</div>
      <div class="sub">شات ذكي · مدعوم بـ Gemini</div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="clearBtn" title="مسح المحادثة">🗑</button>
    <button class="icon-btn" id="settingsBtn" title="الإعدادات">⚙️</button>
  </header>

  <div id="status"></div>

  <div id="messages">
    <div class="welcome" id="welcome">
      أهلاً بيك في <b>Genie</b> 👋<br/>
      عشان الشات يشتغل، اضغط على ⚙️ وحطّ مفتاح Gemini المجاني بتاعك.<br/>
      بعدها اكتب أي رسالة وابدأ الكلام.
    </div>
  </div>

  <footer>
    <textarea id="input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
    <button id="send" title="إرسال">➤</button>
  </footer>

  <!-- Settings -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>الإعدادات</h2>
      <p>
        محتاج مفتاح Gemini مجاني. هاته من هنا:<br/>
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com/app/apikey</a>
        <br/>المفتاح بيتخزّن على جهازك بس، مش بيروح لأي حد تاني.
      </p>
      <label for="apiKey">مفتاح Gemini API</label>
      <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off" />
      <label for="model">الموديل</label>
      <select id="model">
        <option value="gemini-2.5-flash">gemini-2.5-flash (الأحدث · سريع ومجاني)</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro (الأقوى)</option>
        <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (الأخف والأسرع)</option>
        <option value="gemini-2.0-flash">gemini-2.0-flash</option>
      </select>
      <div class="row">
        <button class="btn ghost" id="cancelBtn">إلغاء</button>
        <button class="btn primary" id="saveBtn">حفظ</button>
      </div>
    </div>
  </div>

  <script>
    const LS_KEY = "genie_api_key";
    const LS_MODEL = "genie_model";
    const LS_HISTORY = "genie_history";

    const $ = (id) => document.getElementById(id);
    const messagesEl = $("messages");
    const inputEl = $("input");
    const sendBtn = $("send");
    const statusEl = $("status");
    const overlay = $("overlay");

    let history = []; // {role:'user'|'model', text:''}

    // ---- storage helpers ----
    const getKey = () => localStorage.getItem(LS_KEY) || "";
    const getModel = () => localStorage.getItem(LS_MODEL) || "gemini-2.5-flash";

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type || "";
      if (!msg) statusEl.style.display = "none";
    }

    function checkKey() {
      if (!getKey()) {
        setStatus("لم يتم إدخال مفتاح بعد — افتح الإعدادات ⚙️", "warn");
      } else {
        setStatus("جاهز ✓ — اكتب رسالتك", "ok");
        setTimeout(() => setStatus(""), 2000);
      }
    }

    // ---- UI ----
    function addBubble(text, who, isTyping) {
      const w = $("welcome"); if (w) w.remove();
      const div = document.createElement("div");
      div.className = "msg " + who + (isTyping ? " typing" : "");
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function saveHistory() {
      try { localStorage.setItem(LS_HISTORY, JSON.stringify(history)); } catch (e) {}
    }
    function loadHistory() {
      try {
        const h = JSON.parse(localStorage.getItem(LS_HISTORY) || "[]");
        if (Array.isArray(h) && h.length) {
          history = h;
          history.forEach(m => addBubble(m.text, m.role === "user" ? "user" : "bot"));
        }
      } catch (e) {}
    }

    // ---- Gemini call ----
    async function askGemini(userText) {
      const key = getKey();
      const model = getModel();
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;

      const contents = history.map(m => ({
        role: m.role === "user" ? "user" : "model",
        parts: [{ text: m.text }]
      }));

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents })
      });

      if (!res.ok) {
        const errText = await res.text();
        let msg = "خطأ من Gemini (" + res.status + ")";
        if (res.status === 400) msg = "المفتاح غير صحيح أو الطلب غير سليم. راجع المفتاح في الإعدادات.";
        if (res.status === 403) msg = "المفتاح مرفوض أو غير مفعّل. تأكد من المفتاح.";
        if (res.status === 429) msg = "تجاوزت الحد المجاني مؤقتاً. استنى شوية وجرّب تاني.";
        throw new Error(msg + "\n" + errText.slice(0, 200));
      }

      const data = await res.json();
      const parts = data?.candidates?.[0]?.content?.parts;
      const text = parts?.map(p => p.text).join("") || "(لم يصل رد)";
      return text;
    }

    // ---- send flow ----
    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;

      if (!getKey()) {
        openSettings();
        setStatus("حطّ المفتاح الأول عشان نبدأ ⚙️", "warn");
        return;
      }

      inputEl.value = "";
      inputEl.style.height = "auto";
      addBubble(text, "user");
      history.push({ role: "user", text });
      saveHistory();

      sendBtn.disabled = true;
      const typing = addBubble("Genie بيكتب...", "bot", true);

      try {
        const reply = await askGemini(text);
        typing.remove();
        addBubble(reply, "bot");
        history.push({ role: "model", text: reply });
        saveHistory();
        setStatus("");
      } catch (err) {
        typing.remove();
        addBubble("⚠️ " + err.message, "bot");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // ---- settings ----
    function openSettings() {
      $("apiKey").value = getKey();
      $("model").value = getModel();
      overlay.classList.add("show");
    }
    function closeSettings() { overlay.classList.remove("show"); }

    $("settingsBtn").onclick = openSettings;
    $("cancelBtn").onclick = closeSettings;
    $("saveBtn").onclick = () => {
      localStorage.setItem(LS_KEY, $("apiKey").value.trim());
      localStorage.setItem(LS_MODEL, $("model").value);
      closeSettings();
      checkKey();
    };

    $("clearBtn").onclick = () => {
      if (confirm("مسح كل المحادثة؟")) {
        history = [];
        saveHistory();
        messagesEl.innerHTML = '<div class="welcome">المحادثة اتمسحت. ابدأ من جديد ✍️</div>';
      }
    };

    sendBtn.onclick = send;
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    });

    // ---- init ----
    loadHistory();
    checkKey();
  </script>
</body>
</html>
